<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGradient" cx="20%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#14223d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#050810" />
    </radialGradient>

    <!-- Emerald Brand Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyber Gold / Neon Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glass Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(52, 211, 153, 0.4)" />
      <stop offset="50%" stop-color="rgba(255, 255, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.05)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container (macOS / iOS Executive App Style) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="220" r="140" fill="#10B981" opacity="0.08" filter="blur(40px)" />

  <!-- Main Envelope Body with Cutouts and Luxury Lines -->
  <g filter="url(#emeraldGlow)">
    <!-- Envelope Base Frame -->
    <rect x="106" y="146" width="300" height="220" rx="28" fill="none" stroke="url(#emeraldGrad)" stroke-width="18" stroke-linejoin="round" />

    <!-- Envelope Flap (Top V-Line) -->
    <path d="M 112 156 L 256 270 L 400 156" fill="none" stroke="url(#emeraldGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner AI Spark Star / Sovereign Emblem -->
    <path d="M 256 210 L 263 233 L 286 240 L 263 247 L 256 270 L 249 247 L 226 240 L 249 233 Z" fill="url(#accentGrad)" />

    <!-- Corner Lightning Spark (AI Speed) -->
    <path d="M 350 290 L 375 290 L 360 315 L 385 315 L 345 355 L 355 330 L 335 330 Z" fill="url(#emeraldGrad)" />
  </g>
</svg>
