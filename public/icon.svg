<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient: Royal Sapphire / Deep Midnight Blue -->
    <radialGradient id="bgGradient" cx="25%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Premium Blue & Pure White Linear Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Pure White to Ice Blue Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Glass Rim Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.45)" />
      <stop offset="50%" stop-color="rgba(96, 165, 250, 0.3)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <!-- Deep Blue Glow Shadow -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle Container (Executive App Icon Style) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="230" r="150" fill="#3B82F6" opacity="0.18" filter="blur(45px)" />

  <!-- Main Envelope & Sovereign Monogram in Premium Blue & Real White -->
  <g filter="url(#blueGlow)">
    <!-- Base Envelope Frame (Pure White) -->
    <rect x="106" y="146" width="300" height="220" rx="28" fill="none" stroke="url(#whiteGrad)" stroke-width="18" stroke-linejoin="round" />

    <!-- Envelope Flap V-Line (Premium Blue) -->
    <path d="M 112 156 L 256 270 L 400 156" fill="none" stroke="url(#blueGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Flap Fold (Pure White Accent) -->
    <path d="M 116 356 L 210 250" fill="none" stroke="url(#whiteGrad)" stroke-width="12" stroke-linecap="round" opacity="0.6" />
    <path d="M 396 356 L 302 250" fill="none" stroke="url(#whiteGrad)" stroke-width="12" stroke-linecap="round" opacity="0.6" />

    <!-- Sovereign Diamond / AI Spark Emblem (Real White) -->
    <path d="M 256 200 L 265 228 L 293 236 L 265 244 L 256 272 L 247 244 L 219 236 L 247 228 Z" fill="#FFFFFF" />

    <!-- Corner Lightning Spark (Premium Blue & White) -->
    <path d="M 350 286 L 378 286 L 362 314 L 388 314 L 344 358 L 356 330 L 334 330 Z" fill="url(#blueGrad)" stroke="#FFFFFF" stroke-width="2" />
  </g>
</svg>
